name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install Node dependencies & build dist bundles
        run: |
          npm ci
          npm run build

      - name: Install Python & Playwright dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r e2e_tests/requirements-e2e.txt
          playwright install --with-deps chromium

      - name: Run Python server & CSP hygiene tests
        run: pytest tests/test_server.py -v

      - name: Run Node.js unit tests
        run: node --test tests/js/*.test.mjs

      - name: Run E2E self-test
        run: python e2e_tests/run_e2e.py --mode self-test --browser chromium

      - name: Run full Playwright E2E suite (static-only)
        run: python e2e_tests/run_e2e.py --mode live --static-only --tier all --browser chromium
